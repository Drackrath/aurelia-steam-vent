[package]
name = "aurelia-steam-vent"
version = "0.8.0"
authors = ["Robin Appelman <robin@icewind.nl>"]
edition = "2024"
description = "Interact with the Steam network via rust (Aurelia fork of steam-vent with per-session logon IDs)"
license = "GPL-3.0-or-later"
repository = "https://codeberg.org/Drackrath/aurelia-steam-vent"
readme = "README.md"
rust-version = "1.88.0"

[lib]
name = "steam_vent"

[dependencies]
steam-vent-proto-common = { package = "aurelia-steam-vent-proto-common", version = "0.6.0" }
steam-vent-proto-steam = { package = "aurelia-steam-vent-proto-steam", version = "0.6.0" }
steam-vent-core = { package = "aurelia-steam-vent-core", version = "0.2", path = "./core" }
steam-vent-crypto = { package = "aurelia-steam-vent-crypto", version = "0.3", path = "./crypto" }
steam-machine-id = "0.2.0"
tokio = { version = "1.47.1", features = ["net", "io-util", "macros", "io-std"] }
tokio-util = { version = "0.7.16", features = ["codec"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23.31"
webpki-roots = "1.0.2"
binrw = "0.15.0"
thiserror = "2.0.16"
bytes = "1.10.1"
bytemuck = { version = "1.23.2", features = ["derive"] }
crc = "3.3.0"
byteorder = "1.5.0"
flate2 = "1.1.2"
steamid-ng = "3.0.0"
futures-util = { version = "0.3.31", features = ["sink"] }
dashmap = "6.1.0"
tracing = "0.1.41"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_with = { version = "3.21.0" , features = ["base64"] }
reqwest = { version = "0.13.2", features = ["json"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
base64 = "0.22.1"
num_enum = "0.7.4"
directories = "6.0.0"
another-steam-totp = "0.4.2"
async-stream = "0.3.6"
rand = "0.10.0"
zeroize = "1.8" # Wipe tokens on drop

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt", "rt-multi-thread"] }
tracing-subscriber = "0.3.20"
vdf-reader = "0.3.1"
steam-vent-proto = { package = "aurelia-steam-vent-proto", version = "0.6.0" }

