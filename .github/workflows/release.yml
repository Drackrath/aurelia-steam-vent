name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  crates-io:
    name: Publish to crates.io
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches crate version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(cargo pkgid | sed 's/.*[#@]//')"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: cargo publish --dry-run --locked

      - name: Authenticate with crates.io
        if: github.event_name == 'push'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish aurelia-steam-vent-core (if new version)
        if: github.event_name == 'push'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --manifest-path core/Cargo.toml | jq -r '.packages[0].version')"
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -A "aurelia-steam-vent-release (github.com/Drackrath/aurelia-steam-vent)" \
            "https://crates.io/api/v1/crates/aurelia-steam-vent-core/$version")"
          if [ "$status" = "200" ]; then
            echo "aurelia-steam-vent-core $version already published, skipping"
          else
            cargo publish --manifest-path core/Cargo.toml
          fi

      - name: Publish aurelia-steam-vent
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked
