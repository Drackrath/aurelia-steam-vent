[package]
name = "aurelia-steam-vent-crypto"
version = "0.3.0"
authors = ["Robin Appelman <robin@icewind.nl>"]
description = "Rust implementation of Steam crypto"
edition = "2018"
license = "MIT"
repository = "https://codeberg.org/steam-vent/steam-vent"

[lib]
name = "steam_vent_crypto"

[dependencies]
rand = "0.10"
rsa = { version = "0.10", features = ["pkcs1v15"] }
once_cell = "1"
aes = "0.8.4"
thiserror = "2.0.17"
cbc = "0.1.2"
sha1 = "0.11"
hmac = "0.13"
bytes = "1.10.1"

[build-dependencies]
rsa = { version = "0.10", features = ["encoding"] }
